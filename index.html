<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LHS Countdown</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div id="date" style="text-align: right;"></div>
    <div id="period-name" style="text-align: center; margin-bottom: 200px;"></div>
    
    <table>
        <tr>
            <td><div id="time-left" style="padding: 10px"></div></td>
            <td><progress id="percentage-left" max="100" value="0"></progress></td>
            <td><div id="end-time"></div></td>
        </tr>
    </table>

    
    
    <div id="day-end-left" style="position: fixed; bottom: 10px; right: 10px;"></div>

    <script src="script.js"></script>
</body>
</html>
